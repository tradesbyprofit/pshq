# Offline regression tests. No secrets, no network, no API keys — these run on
# every push so sizing/delivery mistakes get caught before the gold-only
# scanner sends a manual-entry call.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately NOT installing requirements.txt: ccxt is only needed for the
      # optional crypto-data fallback, and the tests must pass on the stdlib
      # alone (that is the OANDA + Telegram path's contract).
      - name: Position sizing + lot rules
        run: python3 test_sizing.py

      - name: ICC engine self-test
        run: python3 icc_engine.py

      - name: No-trade zone + swing detection
        run: python3 test_no_trade_zone.py

      # Gold is alert-only, so the journal IS the real track record — its R
      # arithmetic and slippage sign convention are load-bearing for
      # compound_reality.py --from-journal and must not silently drift.
      - name: Trade journal (alert-vs-actual record, expectancy in R)
        run: python3 test_journal.py

      - name: Gold alert delivery and deployment safety
        run: python3 test_alert_delivery.py

      - name: trade_stats reads the journal with no OANDA keys
        run: python3 trade_stats.py --source journal

      - name: Reality-check calculator (smoke run)
        run: python3 compound_reality.py --paths 50 --max-years 5

      - name: Reality-check calculator can consume a journal edge
        run: python3 compound_reality.py --from-journal --paths 50 --max-years 5
